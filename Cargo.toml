[workspace]
resolver = "2"
members = [
    "crates/featherpdf-core",
    "crates/featherpdf-io",
    "crates/featherpdf-ocr",
    "crates/featherpdf-pelicano",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.98.1"
publish = false


[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Mesmo perfil do FeatherSheet: release sem LTO e incremental, para recompilar rápido.
[profile.medir]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
# hayro 0.8.0 com uma mudança: pula o que cai fora do pedaço desenhado (ver vendor/hayro/src/lib.rs, `fora_da_tela`).
hayro = { path = "vendor/hayro" }
