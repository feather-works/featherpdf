[package]
name = "featherpdf-ocr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "OCR em Rust puro: modelos PP-OCR (PaddleOCR) em ONNX rodando no tract"

[dependencies]
tract-onnx = "0.23"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
featherpdf-core = { path = "../featherpdf-core" }
featherpdf-io = { path = "../featherpdf-io" }
