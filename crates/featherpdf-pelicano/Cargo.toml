[package]
name = "featherpdf-pelicano"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Interface do FeatherPDF no pelicano (a nova tela; a versão Iced fica até tudo ser portado)"

[[bin]]
name = "featherpdf"
path = "src/main.rs"

[dependencies]
featherpdf-core = { path = "../featherpdf-core" }
featherpdf-io = { path = "../featherpdf-io" }
featherpdf-ocr = { path = "../featherpdf-ocr" }
# pelicano do crates.io (a 0.1.29 trouxe Image::pixel: a edição lê a cor da letra sem guardar uma segunda cópia da página).
pelicano = "0.1.30"
# Branch `featherpdf-v0.3.11` do feather-ui: o v0.3.11 (agora com o pelicano 0.1.29 do crates.io) mais a marca FeatherPDF e o F12;
# trocar por uma tag quando a marca entrar no main.
feather-ui = { git = "https://github.com/feather-works/feather-ui.git", rev = "cb692b6" }
feather-draw = { git = "https://github.com/feather-works/feather-draw", tag = "v0.1.1" }
feather-shapes = { git = "https://github.com/feather-works/feather-shapes", tag = "v0.1.2" }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
arboard = { version = "3.6", features = ["wayland-data-control"] }
ab_glyph = "0.2"
tiny-skia = "0.11"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
# Scripts: o mesmo motor de macros (Boa, sandbox) do FeatherSheet.
feather-macros = { git = "https://github.com/feather-works/feather-io", tag = "v0.1.3" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Imprimir no Windows pelo GDI (imprimir_windows.rs); a mesma versão que o winit já traz.
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_Foundation"] }

[build-dependencies]
# Ícone, manifesto e nome do .exe do Windows (build.rs).
embed-resource = "3"

[dev-dependencies]
# Os testes montam um TIFF de várias páginas (o mesmo do featherpdf-io).
tiff = { version = "0.11", default-features = false }
