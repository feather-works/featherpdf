[package]
name = "featherpdf-pelicano"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Interface do FeatherPDF no pelicano (a nova tela; a versão Iced fica até tudo ser portado)"

[[bin]]
name = "featherpdf-pelicano"
path = "src/main.rs"

[dependencies]
featherpdf-core = { path = "../featherpdf-core" }
featherpdf-io = { path = "../featherpdf-io" }
featherpdf-ocr = { path = "../featherpdf-ocr" }
pelicano = { git = "https://github.com/feather-works/pelicano.git", tag = "v0.1.11" }
# Branch `featherpdf` do feather-ui (marca FeatherPDF, F12); trocar por uma tag quando entrar no main.
feather-ui = { git = "https://github.com/feather-works/feather-ui.git", rev = "4eabc66" }
feather-draw = { git = "https://github.com/feather-works/feather-draw", tag = "v0.1.1" }
feather-shapes = { git = "https://github.com/feather-works/feather-shapes", tag = "v0.1.2" }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
arboard = { version = "3.6", features = ["wayland-data-control"] }
ab_glyph = "0.2"
tiny-skia = "0.11"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Scripts: o mesmo motor de macros (Boa, sandbox) do FeatherSheet.
feather-macros = { git = "https://github.com/feather-works/feather-io", tag = "v0.1.3" }
serde_json = "1"
